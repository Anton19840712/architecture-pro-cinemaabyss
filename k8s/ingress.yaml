apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx  # Используем NGINX Ingress Controller
  rules:
  - host: cinemaabyss.local  # Локальный домен для тестирования
    http:
      paths:
      # Весь API трафик идёт через Proxy Service
      - path: /
        pathType: Prefix
        backend:
          service:
            name: proxy-service
            port:
              number: 8000
      # Прямой доступ к Events Service (для отладки)
      - path: /api/events
        pathType: Prefix
        backend:
          service:
            name: events-service
            port:
              number: 8082
