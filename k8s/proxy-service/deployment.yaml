apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  labels:
    app: proxy-service
spec:
  replicas: 2  # Количество pod'ов (инстансов)
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      containers:
      - name: proxy-service
        image: ghcr.io/anton19840712/architecture-pro-cinemaabyss/proxy-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: MONOLITH_URL
          value: "http://monolith:8080"
        - name: MOVIES_SERVICE_URL
          value: "http://movies-service:8081"
        - name: MOVIES_MIGRATION_PERCENT
          value: "50"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
