name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d

          echo "========== Waiting for all services to be healthy =========="

          # Wait for all services to be healthy
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            status=$(docker compose ps --format json | jq -r '.[] | select(.Service == "monolith" or .Service == "movies-service" or .Service == "events-service" or .Service == "proxy-service") | .Health')

            healthy_count=$(echo "$status" | grep -c "healthy" || true)

            if [ "$healthy_count" -eq 4 ]; then
              echo "All services are healthy!"
              break
            fi

            echo "Waiting for services to be healthy... ($elapsed/$timeout seconds)"
            docker compose ps
            sleep 10
            elapsed=$((elapsed + 10))
          done

          if [ $elapsed -ge $timeout ]; then
            echo "Timeout waiting for services to be healthy"
            docker compose ps
            docker compose logs
            exit 1
          fi

          echo "========== All Services are Healthy =========="
          docker compose ps
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install
      
      - name: Run API tests
        run: |
          # Run tests via docker compose (shares network with services)
          docker compose run --rm api-tests
        
      
      - name: Stop services
        if: always()
        run: docker compose down