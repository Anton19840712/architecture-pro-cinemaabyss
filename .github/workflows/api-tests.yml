name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d

          echo "========== Waiting for all services to be healthy =========="

          # Wait for all services to be healthy (robust check)
          timeout=600
          elapsed=0
          services=("monolith" "movies-service" "events-service" "proxy-service")

          while [ $elapsed -lt $timeout ]; do
            healthy_count=0

            for service in "${services[@]}"; do
              health=$(docker compose ps --format json | jq -s -r ".[] | select(.Service == \"$service\") | .Health // .Status // \"unknown\"" 2>/dev/null || echo "unknown")
              if [[ "$health" == *"healthy"* ]]; then
                ((healthy_count++))
              fi
            done

            if [ "$healthy_count" -eq 4 ]; then
              echo "All services are healthy!"
              break
            fi

            echo "Waiting for services to be healthy... ($healthy_count/4) ($elapsed/$timeout seconds)"
            docker compose ps
            sleep 10
            elapsed=$((elapsed + 10))
          done

          if [ $elapsed -ge $timeout ]; then
            echo "Timeout waiting for services to be healthy"
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

          echo "========== All Services are Healthy =========="
          docker compose ps
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install
      
      - name: Run API tests
        id: run_tests
        continue-on-error: true
        run: |
          # Run tests via docker compose (shares network with services)
          docker compose run --rm api-tests

      - name: Collect logs and artifacts
        if: always()
        run: |
          echo "========== Collecting logs =========="
          docker compose logs --no-color > compose-logs.txt || true
          docker compose ps > compose-status.txt || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            compose-logs.txt
            compose-status.txt
            tests/postman/reports/

      - name: Stop services
        if: always()
        run: docker compose down

      - name: Fail if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1