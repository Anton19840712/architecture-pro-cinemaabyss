name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d

          echo "========== Waiting for services to be ready =========="
          echo "Waiting for Kafka..."
          sleep 60

          echo "Waiting for other services..."
          sleep 120

          echo "========== Docker Network Info =========="
          docker network ls
          docker network inspect cinemaabyss-network | head -50

          echo "========== Running Containers =========="
          docker compose ps

          echo "========== Events Service Logs =========="
          docker compose logs events-service --tail=30

          echo "========== Monolith Logs =========="
          docker compose logs monolith --tail=20

          echo "========== Movies Service Logs =========="
          docker compose logs movies-service --tail=20

          echo "========== Proxy Service Logs =========="
          docker compose logs proxy-service --tail=20

          echo "========== Testing connectivity from host =========="
          curl -f http://localhost:8000/health || echo "Proxy health check failed"
          curl -f http://localhost:8082/health || echo "Events health check failed"
          curl -f http://localhost:8080/health || echo "Monolith health check failed"
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install
      
      - name: Run API tests
        working-directory: tests/postman
        run: |
          # Build the Docker image
          docker build -t cinemaabyss-api-tests .

          # Run the tests in Docker
          docker run --network=cinemaabyss-network -v "$(pwd)/reports:/app/reports" cinemaabyss-api-tests
        
      
      - name: Stop services
        if: always()
        run: docker compose down