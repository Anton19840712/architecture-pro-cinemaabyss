# Глобальные настройки
global:
  registry: ghcr.io/anton19840712/architecture-pro-cinemaabyss
  imageTag: latest
  namespace: cinemaabyss

# Image Pull Secrets для доступа к private registry
imagePullSecrets:
  dockerconfigjson: ""  # Base64 encoded .dockerconfigjson, оставить пустым для public images

# Общая конфигурация приложения
config:
  gradualMigration: "true"
  moviesMigrationPercent: "50"

# Monolith конфигурация
monolith:
  enabled: true
  name: monolith
  replicas: 1
  image:
    repository: ghcr.io/anton19840712/architecture-pro-cinemaabyss/monolith
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Movies Service конфигурация
moviesService:
  enabled: true
  name: movies-service
  replicas: 1
  image:
    repository: ghcr.io/anton19840712/architecture-pro-cinemaabyss/movies-service
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "300m"

# Proxy Service конфигурация
proxyService:
  enabled: true
  name: proxy-service
  replicaCount: 2
  image:
    repository: proxy-service
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8000
  env:
    port: "8000"
    monolithUrl: "http://monolith:8080"
    moviesServiceUrl: "http://movies-service:8081"
    moviesMigrationPercent: "50"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  healthCheck:
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

# Events Service конфигурация
eventsService:
  enabled: true
  name: events-service
  replicaCount: 2
  image:
    repository: events-service
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8082
  env:
    port: "8082"
    kafkaBrokers: "kafka:9092"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  healthCheck:
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

# Ingress конфигурация
ingress:
  enabled: true
  className: nginx
  host: cinemaabyss.example.com
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

# Kafka конфигурация
kafka:
  enabled: true
  name: kafka
  replicas: 1
  image:
    repository: wurstmeister/kafka
    tag: "2.13-2.7.0"
    pullPolicy: IfNotPresent
  service:
    port: 9092
  persistence:
    enabled: false
    size: 5Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Zookeeper конфигурация
zookeeper:
  enabled: true
  name: zookeeper
  replicas: 1
  image:
    repository: wurstmeister/zookeeper
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 2181
  persistence:
    enabled: false
    size: 1Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Database (PostgreSQL) конфигурация
database:
  host: postgres
  port: 5432
  name: cinemaabyss
  user: postgres
  password: cG9zdGdyZXM=  # Base64 encoded "postgres"
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
    size: 1Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
