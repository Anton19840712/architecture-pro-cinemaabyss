{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.proxyService.name }}
            port:
              number: {{ .Values.proxyService.service.port }}
      - path: /api/events
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.eventsService.name }}
            port:
              number: {{ .Values.eventsService.service.port }}
{{- end }}
