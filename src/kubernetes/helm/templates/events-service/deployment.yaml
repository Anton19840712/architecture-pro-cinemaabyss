{{- if .Values.eventsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.eventsService.name }}
  labels:
    app: {{ .Values.eventsService.name }}
spec:
  replicas: {{ .Values.eventsService.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.eventsService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.eventsService.name }}
    spec:
      containers:
      - name: {{ .Values.eventsService.name }}
        image: "{{ .Values.global.registry }}/{{ .Values.eventsService.image.repository }}:{{ .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.eventsService.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.eventsService.service.port }}
        env:
        - name: PORT
          value: "{{ .Values.eventsService.env.port }}"
        - name: KAFKA_BROKERS
          value: "{{ .Values.eventsService.env.kafkaBrokers }}"
        resources:
          requests:
            memory: {{ .Values.eventsService.resources.requests.memory }}
            cpu: {{ .Values.eventsService.resources.requests.cpu }}
          limits:
            memory: {{ .Values.eventsService.resources.limits.memory }}
            cpu: {{ .Values.eventsService.resources.limits.cpu }}
        livenessProbe:
          httpGet:
            path: {{ .Values.eventsService.healthCheck.liveness.path }}
            port: {{ .Values.eventsService.service.port }}
          initialDelaySeconds: {{ .Values.eventsService.healthCheck.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.eventsService.healthCheck.liveness.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.eventsService.healthCheck.readiness.path }}
            port: {{ .Values.eventsService.service.port }}
          initialDelaySeconds: {{ .Values.eventsService.healthCheck.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.eventsService.healthCheck.readiness.periodSeconds }}
{{- end }}
