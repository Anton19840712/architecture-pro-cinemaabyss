---
# VirtualService для Proxy Service (timeout + retry)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: proxy-service
spec:
  hosts:
  - proxy-service
  http:
  - route:
    - destination:
        host: proxy-service
        port:
          number: 8000
    timeout: 10s
    retries:
      attempts: 3
      perTryTimeout: 3s
      retryOn: 5xx,reset,connect-failure,refused-stream
---
# VirtualService для Events Service (timeout + retry)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: events-service
spec:
  hosts:
  - events-service
  http:
  - route:
    - destination:
        host: events-service
        port:
          number: 8082
    timeout: 10s
    retries:
      attempts: 3
      perTryTimeout: 3s
      retryOn: 5xx,reset,connect-failure,refused-stream
---
# Gateway для внешнего доступа
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: cinemaabyss-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "cinemaabyss.example.com"
---
# VirtualService для маршрутизации через Gateway
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cinemaabyss-gateway-routes
spec:
  hosts:
  - "cinemaabyss.example.com"
  gateways:
  - cinemaabyss-gateway
  http:
  - match:
    - uri:
        prefix: "/api/events"
    route:
    - destination:
        host: events-service
        port:
          number: 8082
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: proxy-service
        port:
          number: 8000
